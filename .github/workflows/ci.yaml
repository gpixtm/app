name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check generated localization is up to date
        run: |
          flutter gen-l10n
          dart run tool/generate_message_resolver.dart
          dart format lib/presentation/message_resolver.dart lib/l10n/generated
          git diff --exit-code -- lib/l10n/generated lib/presentation/message_resolver.dart
      - run: flutter analyze
      - run: flutter test
