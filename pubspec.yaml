name: gpix
description: "Offline-first hiking, GPX navigation and walk recording."
publish_to: 'none'

# <versionName>+<versionCode>; a release tag is v<versionName>.
version: 1.1.1+3

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  maplibre_gl: ^0.27.1
  sqflite: ^2.4.4
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  xml: ^7.0.1
  geolocator: ^14.1.0
  flutter_compass: ^0.8.1
  wakelock_plus: ^1.8.0
  http: ^1.6.0
  crypto: ^3.0.7
  archive: ^4.3.0
  uuid: ^4.6.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_svg: 2.3.0
  sqflite_common_ffi: ^2.4.3

flutter:
  generate: true

  uses-material-design: true
  assets:
    - assets/demo/
    - assets/branding/generated/gpix-logo-on-light.png
